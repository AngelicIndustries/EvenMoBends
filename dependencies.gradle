dependencies {
    // Provider skins must retain vanilla download hooks so Salamander can preserve expression-slot alpha.
    def wawelAuthDependency = "org.fentanylsolutions.wawelauth:WawelAuth:409cfd2-snapshot:dev"

    // The compatibility stack used by the default EvenMoBends development client.
    // These are deliberately not published as hard dependencies of EvenMoBends.
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Hodgepodge:2.7.211:dev")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Angelica:2.2.17:dev")
    runtimeOnlyNonPublishable("dev.dediamondpro.resourcify:VintageResourcify:1.0.5:dev")
    runtimeOnlyNonPublishable("org.fentanylsolutions.vrap:vrap:1.0.1:dev")
    runtimeOnlyNonPublishable("com.falsepattern:forgelin-mc1.7.10:2.4.3-2.4.10")
    runtimeOnlyNonPublishable("tcb.spiderstpo:Spiders-2.0-1.7.10:0.1.1")

    // devOnlyNonPublishable includes both compile and non-published runtime scopes.
    devOnlyNonPublishable("com.github.GTNewHorizons:GTNHLib:0.11.51:dev")
    // Models, animation evaluation, rendering and resource-pack CEM support.
    implementation("org.fentanylsolutions.salamander:Salamander:8e5a945-snapshot:dev")
    // GTNHLib provides JOML in game through its dependency loader; Salamander's CPU renderer needs it in tests.
    testImplementation("org.joml:joml:1.10.9")
    // Salamander's Java 8 artifact calls the stubs normally provided by the GTNH runtime loader.
    testRuntimeOnly("xyz.wagyourtail.jvmdowngrader:jvmdowngrader-java-api:2.0.1:downgraded-8")
    devOnlyNonPublishable("org.fentanylsolutions.fentlib:FentLib:0.0.55:dev")
    devOnlyNonPublishable("com.github.GTNewHorizons:ModularUI2:2.3.91-1.7.10:dev")
    compileOnly(wawelAuthDependency)
    testImplementation(wawelAuthDependency)
    // SSB and Wawel Auth must be tested separately. Supply a local SSB development jar to opt in.
    if (project.hasProperty("simpleSkinBackportJar")) {
        def ssbJar = file(project.property("simpleSkinBackportJar"))
        if (!ssbJar.isFile()) {
            throw new GradleException("SimpleSkinBackport development jar not found: ${ssbJar}")
        }
        devOnlyNonPublishable(files(ssbJar))
    } else {
        runtimeOnlyNonPublishable(wawelAuthDependency)
    }
    devOnlyNonPublishable("ganymedes01.etfuturum:Et-Futurum-Requiem:2.6.59-GTNH:dev")

    // Off-hand items and blocking, in the development client by default.
    devOnlyNonPublishable("com.github.GTNewHorizons:Backhand:1.8.15:dev")
    if (project.hasProperty("justAShieldJar")) {
        def shieldJar = file(project.property("justAShieldJar"))
        if (!shieldJar.isFile()) {
            throw new GradleException("Just A Shield development jar not found: ${shieldJar}")
        }
        devOnlyNonPublishable(files(shieldJar))
    }

    if (project.hasProperty("aquaAcrobaticsJar")) {
        def aquaJar = file(project.property("aquaAcrobaticsJar"))
        if (!aquaJar.isFile()) {
            throw new GradleException("Aqua Acrobatics development jar not found: ${aquaJar}")
        }
        devOnlyNonPublishable(files(aquaJar))
    }

    // Opt in when testing the Smart Moving policy; its presence intentionally disables player bends.
    if (project.hasProperty("smartMoving")) {
        devOnlyNonPublishable(rfg.deobf("net.smart:SmartMoving:1.7.10-15.8.2-maka"))
        devOnlyNonPublishable(rfg.deobf("api.player:PlayerAPI:1.7.10-1.4.1-maka"))
        devOnlyNonPublishable(rfg.deobf("net.smart:SmartRender:1.7.10-2.1"))
    }
}
